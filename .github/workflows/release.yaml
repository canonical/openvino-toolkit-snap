name: Release

on:
  push:
    paths:
      - 'snap/**'
      - 'command-chain/**'
      - '.github/workflows/release.yaml'
    branches:
      - openvino-toolkit-2404
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build (defaults to selected ref)
        required: false
        type: string
      track:
        description: Snap Store track to publish to
        required: false
        default: latest
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release ${{ matrix.arch }} to ${{ inputs.track || 'latest' }}/edge
    runs-on: self-hosted-linux-${{ matrix.arch }}-jammy-xlarge
    permissions:
      contents: write
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
      fail-fast: false
    steps:
      - name: Checkout the source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Find and parse snapcraft.yaml
        id: snapcraft-yaml
        uses: snapcrafters/ci/parse-snapcraft-yaml@main
      - name: Build snap
        uses: snapcore/action-build@v1
        id: build
        with:
          path: ${{ steps.snapcraft-yaml.outputs.project-root }}
      - name: Review the built snap
        uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: ${{ steps.snapcraft-yaml.outputs.classic }}
          plugs: ${{ steps.snapcraft-yaml.outputs.plugs-file }}
          slots: ${{ steps.snapcraft-yaml.outputs.slots-file }}
      - name: Release to ${{ inputs.track || 'latest' }}/edge
        id: publish
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_PE_BOT }}
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          RELEASE_TRACK: ${{ inputs.track || 'latest' }}
        run: |
          set -o pipefail
          snapcraft upload "$SNAP_FILE" --release="${RELEASE_TRACK}/edge" 2>&1 | tee upload.log
          # Snap files are named <name>_<version>_<arch>.snap.
          version="$(basename "$SNAP_FILE" .snap | cut -d_ -f2)"
          revision="$(grep -oiE 'revision [0-9]+' upload.log | head -1 | grep -oE '[0-9]+' || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # Only the amd64 revision is tagged; matrix jobs can't pass per-arch outputs to a later job.
      - name: Resolve snap version and revision
        id: snap-info
        if: ${{ matrix.arch == 'amd64' && github.ref == 'refs/heads/openvino-toolkit-2404' }}
        env:
          VERSION: ${{ steps.publish.outputs.version }}
          REVISION: ${{ steps.publish.outputs.revision }}
        run: |
          if [ -z "$VERSION" ] || [ -z "$REVISION" ]; then
            echo "::error::Could not read the uploaded snap's version ('$VERSION') or revision ('$REVISION') from the upload step"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag for revision
        if: ${{ matrix.arch == 'amd64' && steps.snap-info.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAP_VERSION: ${{ steps.snap-info.outputs.version }}
          SNAP_REVISION: ${{ steps.snap-info.outputs.revision }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          tag_name="${SNAP_VERSION}-amd64-rev${SNAP_REVISION}"
          if git ls-remote --tags origin | grep -q "refs/tags/${tag_name}"; then
            echo "Tag ${tag_name} already exists in remote repo. Doing nothing."
          else
            git tag -a "${tag_name}" -m "Revision ${SNAP_REVISION} (amd64)"
            git push origin "${tag_name}"
          fi
